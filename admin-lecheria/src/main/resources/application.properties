# ============================================================
# DESARROLLO LOCAL (MySQL)
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/admin_lecheria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}
# No se fija driver-class-name: Spring Boot lo detecta solo segun la URL
# (jdbc:mysql:// -> MySQL,  jdbc:postgresql:// -> PostgreSQL)

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# PRODUCCION (Render + Neon)
# Render inyecta PORT automaticamente
# Neon entrega DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# ============================================================
server.port=${PORT:8092}

# Desactivar Spring Security por ahora
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
